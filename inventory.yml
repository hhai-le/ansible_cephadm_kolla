deployer:
  hosts:
    openstack137:
non_deployer:
  hosts:
    openstack138:
ceph_mon:
  hosts:
    openstack137:
    openstack138:
ceph_osd:
  hosts:
    openstack137:
      device:
        - /dev/sdb
        - /dev/sdc
        - /dev/sdd
        - /dev/sde
    openstack138:
      device:
        - /dev/sda
        - /dev/sdb
        - /dev/sdc
        - /dev/sdd
openstack_control:
  hosts:
    openstack137:
    openstack138:
openstack_network:
  hosts:
    openstack137:
    openstack138:
openstack_compute:
  hosts:
    openstack137:
    openstack138:
openstack_monitoring:
  hosts:
    openstack137:
    openstack138:
openstack_storage:
  hosts:
    openstack137:
    openstack138:
linux:
  hosts:
    openstack137:
      ansible_host: 192.168.86.137
      mgmt_ip: "192.168.86.137/24"
      ceph_internal_ip: "10.0.10.137/24"
      ceph_external_ip: "10.0.20.137/24"
      tunnel_ip: "10.0.30.137/24"
      mgmt_default_gw: "192.168.86.1"
      dns1: "172.16.11.5"
      dns2: "172.16.11.6"
    openstack138:
      ansible_host: 192.168.86.138
      mgmt_ip: "192.168.86.138/24"
      ceph_internal_ip: "10.0.10.138/24"
      ceph_external_ip: "10.0.20.138/24"
      tunnel_ip: "10.0.30.138/24"
      mgmt_default_gw: "192.168.86.1"
      dns1: "172.16.11.5"
      dns2: "172.16.11.6"
  vars:
    ansible_become: true
    ansible_become_pass: Password
    ansible_ssh_retries: 10
    ansible_ssh_extra_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
    ansible_ssh_pass: Password
    ansible_user: linuxadmin