linux:
  hosts:
    openstack139:
      ansible_host: 192.168.86.139
      ceph_internal_ip: 10.0.2.139
      ceph_external_ip: 10.0.10.139
      tunnel_ip: 10.0.20.139
    openstack135:
      ansible_host: 192.168.86.135
      ceph_internal_ip: 10.0.2.135
      ceph_external_ip: 10.0.10.135
      tunnel_ip: 10.0.20.135
  vars:
    ansible_become: true
    ansible_become_pass: Password
    ansible_ssh_retries: 10
    ansible_ssh_extra_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
    ansible_ssh_pass: Password
    ansible_user: linuxadmin